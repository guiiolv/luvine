spring:
  application:
    name: luvine
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:/db/migration

app:
  jwt:
    private-key: classpath:/security/private.pem
    public-key: classpath:/security/public.pem
  brevo:
    api-key: ${BREVO_API_KEY}
    sender-email: ${BREVO_SENDER_EMAIL}
    sender-name: ${BREVO_SENDER_NAME}
    templates:
      email-verification-code: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_CODE}